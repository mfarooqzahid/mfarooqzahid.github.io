<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000">
<title>Containerized notes app on AWS</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96a5"/>
  </marker>
</defs>
<rect width="2000" height="1000" fill="#ffffff"/>
<text x="90" y="82" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#12161c">Containerized notes app on AWS</text>
<text x="90" y="124" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#566273">Docker Compose on EC2, provisioned with Terraform and configured with Ansible.</text>
<rect x="100" y="220" width="260" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="126" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">Developer</text><text x="126" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">pushes code</text>
<rect x="400" y="220" width="260" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="426" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">GitHub</text><text x="426" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">source</text>
<rect x="700" y="220" width="300" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="726" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">Jenkins</text><text x="726" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">builds the image</text>
<rect x="1040" y="220" width="300" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1066" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">Docker Hub</text><text x="1066" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">image registry</text>
<line x1="360" y1="290" x2="394" y2="290" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="290" x2="694" y2="290" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1000" y1="290" x2="1034" y2="290" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1380" y="160" width="520" height="460" fill="none" stroke="#d3d9e1" stroke-width="2"/><text x="1410" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#566273" letter-spacing="2.5">EC2 INSTANCE</text>
<rect x="1410" y="240" width="460" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1436" y="288" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Nginx</text><text x="1436" y="322" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">reverse proxy</text>
<line x1="1640" y1="330" x2="1640" y2="354" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1410" y="360" width="460" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1436" y="408" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Notes app</text><text x="1436" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">Node.js and Express</text>
<line x1="1640" y1="450" x2="1640" y2="474" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1410" y="480" width="460" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1436" y="528" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">MongoDB</text><text x="1436" y="562" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">data store</text>
<line x1="1340" y1="290" x2="1374" y2="290" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="680" width="800" height="160" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/>
<text x="126" y="726" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12161c">Newer iteration</text>
<text x="126" y="762" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">GitHub Actions builds the image, replacing Jenkins</text>
<text x="126" y="790" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">for that step.</text>
<rect x="1000" y="680" width="900" height="260" fill="none" stroke="#d3d9e1" stroke-width="2" stroke-dasharray="10 8"/><text x="1030" y="718" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#566273" letter-spacing="2.5">PROVISION AND CONFIGURE</text>
<rect x="1040" y="740" width="380" height="120" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1066" y="788" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Terraform</text><text x="1066" y="822" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">provisions EC2</text>
<rect x="1460" y="740" width="380" height="120" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1486" y="788" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Ansible</text><text x="1486" y="822" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">installs Docker and Compose</text>
<line x1="1450" y1="680" x2="1450" y2="626" stroke="#8b96a5" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
</svg>