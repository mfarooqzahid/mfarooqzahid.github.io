<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125">
<title>DevSecOps pipeline for a Netflix clone</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3b2"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d8dff"/>
  </marker>
</defs>
<rect width="2000" height="1125" fill="#050505"/>
<text x="90" y="82" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#f2f4f7">DevSecOps pipeline: Netflix clone</text>
<rect x="180" y="150" width="370" height="120" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="208" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Developer</text><text x="208" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">pushes code</text>
<rect x="600" y="150" width="370" height="120" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="628" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">GitHub repository</text><text x="628" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">source of truth</text>
<rect x="1020" y="150" width="370" height="120" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="1048" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Jenkins server</text><text x="1048" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">CI/CD, hosted on EC2</text>
<line x1="550" y1="210" x2="594" y2="210" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="970" y1="210" x2="1014" y2="210" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1205" y1="270" x2="1205" y2="334" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="340" width="1780" height="500" fill="none" stroke="#2a2f36" stroke-width="2" stroke-dasharray="10 8"/>
<text x="150" y="388" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9aa3b2" letter-spacing="2.5">JENKINS PIPELINE, RUNS ON EVERY COMMIT</text>
<rect x="180" y="420" width="360" height="145" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="208" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9aa3b2" letter-spacing="1">01</text><text x="208" y="500" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Checkout</text><text x="208" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">pull code from GitHub</text>
<rect x="580" y="420" width="360" height="145" fill="#0b1a2e" stroke="#2f6fdb" stroke-width="2"/><text x="608" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4d8dff" letter-spacing="1">02</text><text x="608" y="500" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">SonarQube analysis</text><text x="608" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#b8c4d8">code quality gate</text>
<rect x="980" y="420" width="360" height="145" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="1008" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9aa3b2" letter-spacing="1">03</text><text x="1008" y="500" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Install dependencies</text><text x="1008" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">npm install</text>
<rect x="1380" y="420" width="360" height="145" fill="#0b1a2e" stroke="#2f6fdb" stroke-width="2"/><text x="1408" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4d8dff" letter-spacing="1">04</text><text x="1408" y="500" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">OWASP Dependency-Check</text><text x="1408" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#b8c4d8">known-vulnerable packages</text>
<rect x="180" y="660" width="360" height="145" fill="#0b1a2e" stroke="#2f6fdb" stroke-width="2"/><text x="208" y="696" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4d8dff" letter-spacing="1">05</text><text x="208" y="740" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Trivy filesystem scan</text><text x="208" y="776" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#b8c4d8">files and config issues</text>
<rect x="580" y="660" width="360" height="145" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="608" y="696" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9aa3b2" letter-spacing="1">06</text><text x="608" y="740" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Docker build</text><text x="608" y="776" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">TMDB key as build arg</text>
<rect x="980" y="660" width="360" height="145" fill="#0b1a2e" stroke="#2f6fdb" stroke-width="2"/><text x="1008" y="696" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4d8dff" letter-spacing="1">07</text><text x="1008" y="740" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Trivy image scan</text><text x="1008" y="776" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#b8c4d8">CVEs in the built image</text>
<rect x="1380" y="660" width="360" height="145" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="1408" y="696" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9aa3b2" letter-spacing="1">08</text><text x="1408" y="740" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Deploy</text><text x="1408" y="776" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">run container on EC2</text>
