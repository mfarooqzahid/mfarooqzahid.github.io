<line x1="1340" y1="492" x2="1374" y2="492" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1340" y1="732" x2="1374" y2="732" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1560,565 1560,620 360,620 360,654" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
