<text x="216" y="942" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">Build or deploy step</text>
<line x1="1530" y1="805" x2="1530" y2="924" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1340" y="930" width="380" height="130" fill="#141414" stroke="#33383f" stroke-width="2"/><text x="1368" y="980" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f2f4f7">Netflix clone, live</text><text x="1368" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9aa3b2">container on EC2</text>
