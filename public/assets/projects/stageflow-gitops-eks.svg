<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000">
<title>GitOps on Amazon EKS</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96a5"/>
  </marker>
</defs>
<rect width="2000" height="1000" fill="#ffffff"/>
<text x="90" y="82" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#12161c">GitOps on Amazon EKS</text>
<text x="90" y="124" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#566273">ArgoCD keeps dev, uat and preprod in sync with Git.</text>
<rect x="100" y="200" width="280" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="126" y="248" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">Developer</text><text x="126" y="282" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">pushes changes</text>
<rect x="430" y="200" width="340" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="456" y="248" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">GitHub</text><text x="456" y="282" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">app and Helm charts</text>
<rect x="820" y="200" width="340" height="140" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="846" y="248" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">GitHub Actions</text><text x="846" y="282" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">CI for dev, uat and preprod</text>
<line x1="380" y1="270" x2="424" y2="270" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="770" y1="270" x2="814" y2="270" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="430" width="340" height="150" fill="#eef3ff" stroke="#1d4ed8" stroke-width="2"/><text x="456" y="478" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">ArgoCD</text><text x="456" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#3f4a5a">watches Git, syncs each environment</text>
<line x1="600" y1="340" x2="600" y2="424" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="900" y="400" width="900" height="280" fill="none" stroke="#d3d9e1" stroke-width="2"/><text x="930" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#566273" letter-spacing="2.5">EKS CLUSTER, AP-SOUTHEAST-2</text>
<rect x="940" y="480" width="240" height="130" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/>
<text x="964" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">dev</text>
<text x="964" y="566" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">Helm release</text>
<rect x="1220" y="480" width="240" height="130" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/>
<text x="1244" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">uat</text>
<text x="1244" y="566" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">Helm release</text>
<rect x="1500" y="480" width="240" height="130" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/>
<text x="1524" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12161c">preprod</text>
<text x="1524" y="566" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">Helm release</text>
<line x1="770" y1="505" x2="894" y2="505" stroke="#8b96a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="760" width="1800" height="180" fill="none" stroke="#d3d9e1" stroke-width="2" stroke-dasharray="10 8"/><text x="130" y="798" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#566273" letter-spacing="2.5">SUPPORTING INFRASTRUCTURE</text>
<rect x="140" y="820" width="500" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="166" y="868" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">AWS CDK + eksctl</text><text x="166" y="902" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">provision the cluster</text>
<rect x="700" y="820" width="450" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="726" y="868" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Public ELB</text><text x="726" y="902" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">exposes ArgoCD</text>
<rect x="1210" y="820" width="450" height="90" fill="#ffffff" stroke="#d3d9e1" stroke-width="2"/><text x="1236" y="868" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12161c">Bastion EC2</text><text x="1236" y="902" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#3f4a5a">cluster access</text>
</svg>